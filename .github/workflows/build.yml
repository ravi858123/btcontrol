name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # nodig om een release aan te maken bij een tag

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optioneel: alleen gevuld als je de secrets hebt aangemaakt (zie onderaan)
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: JDK 17 installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # De repo bevat geen Gradle-wrapper; AGP 8.5.0 vereist Gradle >= 8.7
      - name: Gradle 8.7 installeren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Debug- en release-APK bouwen
        run: gradle assembleDebug assembleRelease --stacktrace --no-daemon

      # Release-APK ondertekenen (alleen als de keystore-secrets bestaan)
      - name: Release-APK ondertekenen
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          UNSIGNED="$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n 1)"
          ALIGNED="$RUNNER_TEMP/aligned.apk"
          SIGNED="app/build/outputs/apk/release/BTControl-release-signed.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Debug-APK uploaden
        uses: actions/upload-artifact@v4
        with:
          name: BTControl-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release-APK uploaden
        uses: actions/upload-artifact@v4
        with:
          name: BTControl-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Bij een tag (bijv. v2.0.1) automatisch een GitHub Release met APK's maken
      - name: GitHub Release maken
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true

# ---------------------------------------------------------------------------
# Optioneel ondertekenen: voeg deze repository-secrets toe
# (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64    -> base64 -w0 mijn-release.jks
#   KEYSTORE_PASSWORD  -> wachtwoord van de keystore
#   KEY_ALIAS          -> alias van de sleutel
#   KEY_PASSWORD       -> wachtwoord van de sleutel
# Zonder secrets levert de workflow een debug-APK (direct installeerbaar) en
# een unsigned release-APK op.
# ---------------------------------------------------------------------------
